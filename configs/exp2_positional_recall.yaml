experiment_id: exp2_positional_recall
description: "RQ2 — Positional Recall Mapping: PRA as probe position varies 0.0–1.0"

models:
  - gpt-5.2
  - claude-sonnet-4-6
  - grok-4.1-fast
  - deepseek-v3.2

seeds: [1, 2, 3]

# Fixed 50K context — all positions tested at this size
# 100K overlay deferred; rerun at 100K later if budget permits (needed for Fig 4 overlay)
context_sizes: [50000]

# 7 probe positions — sufficient for smooth U-curve in Fig 4
# Retains 0.05/0.95 endpoints for primacy/recency; 0.35 and 0.65 dropped for budget
positions: [0.05, 0.15, 0.25, 0.50, 0.75, 0.85, 0.95]

probes_per_run: 1           # one probe per positional run
probe_type_mix: [0.40, 0.35, 0.25]
domain_mix: "equal"

max_output_tokens: 1000
max_concurrent: 6
temperature: 0.0

cost_confirm_threshold: 500.0
dry_run: false
mock_mode: false

output_dir: outputs/exp2
checkpoint_db: ""
