experiment_id: exp5_tokenizer_divergence
description: "RQ5 — Cross-Model Tokenizer Divergence (local only, no API calls)"

# Tokenizer IDs for the 4 target models + mock baseline
models:
  - gpt-5.2
  - claude-sonnet-4-6
  - grok-4.1-fast
  - deepseek-v3.2
  - mock

seeds: [42]

# No context_sizes, positions, or turns — local experiment only
max_output_tokens: 0
max_concurrent: 1
temperature: 0.0
mock_mode: true    # Forced true in code regardless

cost_confirm_threshold: 999999.0   # Never prompt — this is free
dry_run: false

output_dir: outputs/exp5
checkpoint_db: ""

extra:
  n_samples: 1000     # 1000 samples per Fig 10 spec
  tokens_per_sample: 500
  tokenizer_ids:
    - gpt-5.2
    - claude-sonnet-4-6
    - grok-4.1-fast
    - deepseek-v3.2
