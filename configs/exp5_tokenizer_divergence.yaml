experiment_id: exp5_tokenizer_divergence
description: "RQ5 — Cross-Model Tokenizer Divergence (local only, no API calls)"

# These are treated as tokenizer IDs (not API model IDs)
models:
  - gpt-4.1
  - claude-sonnet-4-6
  - gemini-2.5-pro
  - grok-4.1-fast
  - deepseek-v3.2
  - llama-4-maverick
  - mock

seeds: [42]

# No context_sizes, positions, or turns — local experiment only
# max_concurrent and temperature are irrelevant here

max_output_tokens: 0
max_concurrent: 1
temperature: 0.0
mock_mode: true    # Forced true in code regardless — just make it explicit

cost_confirm_threshold: 999999.0   # Never prompt — this is free
dry_run: false

output_dir: outputs/exp5
checkpoint_db: ""

extra:
  n_samples: 500
  tokens_per_sample: 500
  tokenizer_ids:
    - gpt-4.1
    - claude-sonnet-4-6
    - gemini-2.5-pro
    - deepseek-v3.2
    - llama-4-maverick
    - mock
