experiment_id: exp1_context_fidelity
description: "RQ1 — Context Fidelity Decay: PRA as context grows 10K to 200K tokens"

models:
  - gpt-5.2
  - claude-sonnet-4-6
  - grok-4.1-fast
  - deepseek-v3.2

seeds: [1, 2, 3]

# Context sizes: {10K, 25K, 50K, 100K, 150K} — 200K dropped to stay within per-provider budget
# 15x range still fully characterises fidelity decay trend (Fig 1)
# Note: deepseek-v3.2 max is 65K — runs at 10K/25K/50K only; orchestrator skips oversized runs
context_sizes: [10000, 25000, 50000, 100000, 150000]

# Probe settings
probes_per_run: 10
probe_type_mix: [0.40, 0.35, 0.25]   # explicit_recall, grounded_reasoning, implicit_context
domain_mix: "equal"

# Execution
max_output_tokens: 2000
max_concurrent: 4
temperature: 0.0

# Safety
cost_confirm_threshold: 500.0
dry_run: false
mock_mode: false

output_dir: outputs/exp1
checkpoint_db: ""
