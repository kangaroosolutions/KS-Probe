experiment_id: exp2_positional_recall
description: "RQ2 Enhanced — Positional Recall: 7 seeds + extreme positions (0.01/0.99) + mid-gap fill"

models:
  - gpt-5.2
  - claude-sonnet-4-6
  - grok-4.1-fast
  - deepseek-v3.2

# 7 seeds for statistical power
seeds: [1, 2, 3, 4, 5, 6, 7]

# Fixed 50K context
context_sizes: [50000]

# 11 positions: original 7 + 4 new (0.01, 0.35, 0.65, 0.99)
# 0.01/0.99 = extreme primacy/recency (headline finding territory)
# 0.35/0.65 = fills gaps for smoother U-curve characterization
# Checkpoint skips seeds 1-3 at positions 0.05-0.95 (already done)
positions: [0.01, 0.05, 0.15, 0.25, 0.35, 0.50, 0.65, 0.75, 0.85, 0.95, 0.99]

probes_per_run: 1
probe_type_mix: [0.40, 0.35, 0.25]
domain_mix: "equal"

max_output_tokens: 1000
max_concurrent: 40
temperature: 0.0

cost_confirm_threshold: 500.0
dry_run: false
mock_mode: false

output_dir: outputs/exp2
checkpoint_db: ""
